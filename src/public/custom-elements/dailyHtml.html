<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#F0F4FA;--surface:#FFFFFF;--surface2:#E8EEF7;
      --border:rgba(15,23,42,.08);--border2:rgba(15,23,42,.15);
      --text:#0F172A;--sub:#475569;--muted:#94A3B8;
      --gold:#A8844A;--gold2:#6C522E;
      --gold-bg:rgba(180,138,79,.10);--gold-border:rgba(168,132,74,.22);
      --ok:#166534;--warn:#92400E;--danger:#991B1B;--info:#1E3A8A;
      --shadow:0 2px 12px rgba(15,23,42,.06);--shadow-lg:0 8px 28px rgba(15,23,42,.14);
      --r:14px;--r-lg:18px;--r-pill:999px;--sb-w:220px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    body{overflow:hidden}
    .hidden{display:none!important}
    /* ── Shell & Sidebar ── */
    .shell{display:flex;height:100vh;overflow:hidden}
    .shell-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .shell-content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:14px 18px}
    .shell-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;min-height:62px;position:relative;z-index:20}
    .shell-topdate{font:700 12px/1 system-ui;color:var(--muted)}
    .shell-page-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
    .shell-page-name{display:flex;align-items:center;gap:9px;font:900 15px/1.2 system-ui,-apple-system,sans-serif;color:var(--text);letter-spacing:-.01em}
    .shell-page-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--gold-bg);border:1px solid var(--gold-border);flex:0 0 28px;color:var(--gold)}
    .shell-page-icon svg{width:14px;height:14px}
    .shell-page-sub{font:700 11px/1 system-ui;color:var(--muted);padding-left:37px}
    .shell-top-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
    .sb{width:var(--sb-w);flex:0 0 var(--sb-w);display:flex;flex-direction:column;height:100vh;overflow:hidden;background:linear-gradient(180deg,#2a1f0e 0%,#3d2b12 55%,#4f3a22 100%);position:relative}
    .sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.08)}
    .sb-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font:900 17px/1 system-ui;flex:0 0 36px}
    .sb-brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
    .sb-brand-name{font:900 13px/1.2 system-ui;color:#FEFCF7;letter-spacing:-.01em}
    .sb-brand-sub{font:700 10px/1 system-ui;color:rgba(255,255,255,.45);margin-top:2px}
    .sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
    .sb-nav::-webkit-scrollbar{display:none}
    .sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.62);cursor:pointer;transition:all .16s;text-align:left;width:100%;font:700 13px/1.2 system-ui,-apple-system,sans-serif;appearance:none}
    .sb-item:hover{background:rgba(255,255,255,.08);color:#FEFCF7;border-color:rgba(255,255,255,.1)}
    .sb-item.active{background:linear-gradient(135deg,rgba(168,132,74,.22),rgba(168,132,74,.10));color:var(--gold);border-color:rgba(168,132,74,.22);font-weight:900}
    .sb-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.75}
    .sb-item.active svg{opacity:1}
    .sb-item-label{flex:1;min-width:0;font-size:13px}
    .sb-section{font:900 9px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:12px 12px 4px;margin-top:2px;pointer-events:none}
    .sb-footer{flex:0 0 auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,.08)}
    .shell-content::-webkit-scrollbar{width:5px}
    .shell-content::-webkit-scrollbar-track{background:transparent}
    .shell-content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
    .userWrap,.userMenuWrap{position:relative;display:inline-flex;align-items:center;flex:0 0 auto;overflow:visible;z-index:6}
    .userBtn,.userMenuBtn{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--border2);background:rgba(15,23,42,.04);border-radius:var(--r-pill);cursor:pointer;font:900 12px/1.1 system-ui;color:var(--text);transition:all .15s}
    .userBtn:hover,.userMenuBtn:hover{background:rgba(15,23,42,.08)}
    .userBadge{width:28px;height:28px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--gold-bg);color:var(--gold);font:900 13px/1 system-ui;border:1px solid var(--gold-border)}
    .userText{display:flex;flex-direction:column;align-items:flex-start}
    .userName{font-weight:900;font-size:13px;color:var(--text)}
    .userRole{font-size:11px;color:var(--muted);font-weight:700}
    .caret{font-size:10px;color:var(--muted)}
    .menu,.userMenu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow-lg);display:none;z-index:999999;overflow:hidden}
    .menu.open,.userMenu.open{display:block}
    .menuHead,.userMenuHead{padding:12px 14px;background:var(--gold-bg);border-bottom:1px solid var(--gold-border)}
    .menuItem,.userMenuItem{padding:11px 14px;font:800 13px/1.2 system-ui;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;width:100%;transition:background .12s}
    .menuItem:last-child,.userMenuItem:last-child{border-bottom:none}
    .menuItem:hover,.userMenuItem:hover{background:rgba(15,23,42,.05)}
    .menuItem.danger,.userMenuItem.danger{color:#B91C1C}
    .menuItem.danger:hover,.userMenuItem.danger:hover{background:rgba(239,68,68,.08)}
    @media(max-width:900px){
      .sb{width:60px;flex:0 0 60px}
      .sb-brand-text,.sb-item-label,.sb-brand-sub,.sb-section{display:none}
      .sb-brand{justify-content:center;padding:14px 0}
      .sb-item{justify-content:center;padding:10px}
      .sb-item svg{flex:0 0 22px;width:22px;height:22px}
      .shell-content{padding:10px 12px}
    }
    /* ── Shared pills / buttons ── */
    .btn{appearance:none;border:1px solid var(--border2);background:rgba(0,0,0,.04);color:var(--sub);border-radius:12px;padding:7px 10px;font:800 10.5px/1 system-ui,-apple-system,sans-serif;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s}
    .btnPrimary{background:linear-gradient(135deg,var(--gold),#C8952E);color:#1a1208;border-color:transparent;box-shadow:0 2px 8px rgba(154,110,30,.22)}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .btnPrimary:hover{box-shadow:0 4px 14px rgba(154,110,30,.34)!important}
    .input,.select{appearance:none;border:1px solid var(--border2);background:var(--surface2);border-radius:10px;padding:7px 9px;font:800 11px/1.2 system-ui,-apple-system,sans-serif;color:var(--text);outline:none}
    .input:focus,.select:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(154,110,30,.12)}
    .surface{background:var(--surface);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow)}

    /* ── Rebuild: 3-column ops board ── */
    .rb-controls{padding:10px 12px;margin-bottom:12px}
    .rb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .rb-status{padding:5px 10px;border:1px solid var(--border2);border-radius:10px;background:rgba(0,0,0,.03);font:800 10px/1.35 system-ui;color:var(--sub);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rb-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
    .rb-scard{padding:14px 16px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
    .rb-sk{font:900 9.5px/1 system-ui;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .rb-sv{font:900 26px/1 system-ui;color:var(--text);letter-spacing:-.02em;margin-top:3px}
    .rb-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start;margin-bottom:20px}
    .rb-col{background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
    .rb-colhead{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .rb-colhead strong{font:900 11px/1 system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--text)}
    .rb-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.04);border:1px solid var(--border);font:900 10px/1 system-ui;color:var(--sub)}
    .rb-colbody{display:flex;flex-direction:column;gap:0;max-height:70vh;overflow-y:auto}
    .rb-colbody::-webkit-scrollbar{width:4px}
    .rb-colbody::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
    .rb-card{padding:12px 14px;border-bottom:1px solid var(--border);transition:background .12s}
    .rb-card:last-child{border-bottom:none}
    .rb-card:hover{background:rgba(0,0,0,.02)}
    .rb-card-time{display:inline-flex;align-items:center;padding:5px 9px;border-radius:10px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);font:900 12px/1 system-ui;margin-bottom:7px}
    .rb-card-name{font:900 12.5px/1.3 system-ui;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rb-card-sub{font:800 10.5px/1.35 system-ui;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rb-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
    .rb-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;font:900 9px/1 system-ui;border:1px solid var(--border);background:rgba(0,0,0,.03);color:var(--sub)}
    .rb-tag.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.22);color:#B45309}
    .rb-tag.info{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.22);color:#1D4ED8}
    .rb-tag.ok{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.22);color:#065F46}
    .rb-card-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
    .rb-btn{appearance:none;border:1px solid var(--border);background:rgba(0,0,0,.03);border-radius:8px;padding:5px 9px;font:900 9.5px/1 system-ui;color:var(--sub);cursor:pointer;transition:all .14s}
    .rb-btn:hover{background:rgba(0,0,0,.06);transform:translateY(-1px)}
    .rb-btn.primary{background:linear-gradient(135deg,var(--gold),#C8952E);color:#1a1208;border-color:transparent}
    .rb-btn.primary:hover{box-shadow:0 4px 10px rgba(154,110,30,.30)}
    .rb-empty{padding:28px 16px;text-align:center;font:800 11.5px/1.5 system-ui;color:var(--muted)}
    #colOut{border-top:3px solid var(--gold)}
    #colIn{border-top:3px solid #10B981}
    #colBookings{border-top:3px solid var(--gold2)}
    @media(max-width:980px){.rb-board{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.rb-board{grid-template-columns:1fr}.rb-row{gap:6px}}
  </style>
</head>
<body>
<div class="shell">
<nav class="sb">
  <div class="sb-brand">
    <div class="sb-logo">D</div>
    <div class="sb-brand-text">
      <span class="sb-brand-name">DIAMOND</span>
      <span class="sb-brand-sub">Backroom</span>
    </div>
  </div>
  <div class="sb-nav">
      <div class="sb-section">Ops</div>
      <button class="sb-item" data-route="home" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="sb-item-label">Myroom</span></button>
      <button class="sb-item active" data-route="daily" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="sb-item-label">Daily</span></button>
      <div class="sb-section">Fleet</div>
      <button class="sb-item" data-route="fleet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v9a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="20" r="1"/><circle cx="15" cy="20" r="1"/></svg><span class="sb-item-label">Fleet</span></button>
      <button class="sb-item" data-route="fleetCal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg><span class="sb-item-label">Fleet Cal</span></button>
      <div class="sb-section">Manage</div>
      <button class="sb-item" data-route="customers" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="sb-item-label">Customers</span></button>
      <button class="sb-item" data-route="bookings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span class="sb-item-label">Bookings</span></button>
      <button class="sb-item" data-route="contract" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg><span class="sb-item-label">Contract</span></button>
      <div class="sb-section">System</div>
      <button class="sb-item" data-route="settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="sb-item-label">Settings</span></button>
  </div>
  <div class="sb-footer"></div>
</nav>
  <div class="shell-main">
    <div class="shell-top">
      <div class="shell-page-info">
        <div class="shell-page-name"><span class="shell-page-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Daily Ops</div>
        <div class="shell-page-sub">Daily operations · confirmed &amp; live workspace</div>
      </div>
      <div class="shell-top-right">
        <span class="shell-topdate" id="todayMeta">—</span>
        <div class="userMenuWrap" style="display:none">
          <button class="userMenuBtn" id="userMenuBtn" type="button">
            <span class="userBadge" id="userBadge">OP</span>
            <span class="userText"><span class="userName" id="menuUserName">Operator</span><span class="userRole" id="menuUserRole">Backroom</span></span>
            <span class="caret">▾</span>
          </button>
          <div class="userMenu" id="userMenu">
            <div class="userMenuHead"><div class="userName" id="menuUserName2">Operator</div><div class="userRole" id="menuUserRole2">Backroom</div></div>
            <button class="userMenuItem" data-menu-action="reload" type="button">Ανανέωση σελίδας</button>
            <button class="userMenuItem danger" data-menu-action="logout" type="button">Αποσύνδεση</button>
          </div>
        </div>
      </div>
    </div>

    <main class="shell-content">

      <!-- Controls bar -->
      <section class="surface rb-controls">
        <div class="rb-row">
          <button class="btn" id="btnPrev" type="button">&#8592;</button>
          <input class="input" id="datePick" type="date" style="width:136px" />
          <button class="btn" id="btnNext" type="button">&#8594;</button>
          <button class="btn" id="btnToday" type="button">&#931;&#942;&#956;&#949;&#961;&#945;</button>
          <button class="btn btnPrimary" id="btnRefresh" type="button">&#8635;</button>
          <input class="input" id="globalSearch" placeholder="RES, &#960;&#949;&#955;&#940;&#964;&#951;&#962;, &#972;&#967;&#951;&#956;&#945;, flight&#8230;" style="flex:1 1 200px;min-width:120px" />
          <select class="select" id="stationFilter"><option value="all">&#8704;&#955;&#949;&#962;</option></select>
          <span class="rb-status" id="status">Loading&#8230;</span>
        </div>
      </section>

      <!-- KPI summary cards -->
      <div id="summaryGrid" class="rb-summary"></div>

      <!-- 3-column ops board -->
      <div class="rb-board">
        <div class="rb-col" id="colOut">
          <div class="rb-colhead"><strong>Check-outs</strong><span class="rb-badge" id="cntOut">0</span></div>
          <div class="rb-colbody" id="listOut"><div class="rb-empty">Loading&#8230;</div></div>
        </div>
        <div class="rb-col" id="colIn">
          <div class="rb-colhead"><strong>Check-ins</strong><span class="rb-badge" id="cntIn">0</span></div>
          <div class="rb-colbody" id="listIn"><div class="rb-empty">Loading&#8230;</div></div>
        </div>
        <div class="rb-col" id="colBookings">
          <div class="rb-colhead"><strong id="bookingsColLabel">Bookings</strong><span class="rb-badge" id="cntBookings">0</span></div>
          <div class="rb-colbody" id="listBookings"><div class="rb-empty">Loading&#8230;</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ── DOM refs ── */
  const $ = (id) => document.getElementById(id);
  const els = {
    status:      $('status'),
    datePick:    $('datePick'),
    station:     $('stationFilter'),
    search:      $('globalSearch'),
    summaryGrid: $('summaryGrid'),
    listOut:     $('listOut'),
    listIn:      $('listIn'),
    listBookings:$('listBookings'),
    cntOut:      $('cntOut'),
    cntIn:       $('cntIn'),
    cntBookings: $('cntBookings'),
    bookingsLabel:$('bookingsColLabel')
  };

  /* ── State ── */
  const state = {
    data: { tabs:{}, summary:{}, stations:[] },
    search: '',
    station: 'all',
    user: { name:'Operator', role:'Backroom' }
  };

  /* ── Utilities ── */
  function s(v){ return String(v ?? '').trim(); }
  function esc(v){ return s(v).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function asDate(v){ const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  function ymd(v){ const d = asDate(v) || new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function hhmm(v){ const d = asDate(v); if(!d) return ''; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function addDays(str, n){ const d = asDate(str) || new Date(); d.setDate(d.getDate()+n); return ymd(d); }
  function postToWix(payload){ try{ window.parent.postMessage(payload,'*'); }catch(_){} }
  function setStatus(t){ if(els.status) els.status.textContent = s(t); }

  /* ── Data request ── */
  function reloadData(){
    const d = els.datePick.value || ymd(new Date());
    const start = new Date(d + 'T00:00:00');
    const end   = new Date(d + 'T23:59:59');
    setStatus('Loading…');
    postToWix({ type:'requestDailyData', date:d, startISO:start.toISOString(), endISO:end.toISOString() });
  }

  /* ── Filtering ── */
  function norm(v){ return s(v).toLowerCase(); }
  function stationOf(item){ return s(item.station||item.pickupStation||item.dropoffStation||item.pickuppoint||item.dropoffpoint||''); }
  function blob(item){
    return [item.bookingNumber,item.customerName,item.name,item.phone,item.email,
            item.pickuppoint,item.dropoffpoint,item.assignedVehicleLabel,
            item.assignedVehiclePlate,item.assignedVehicleModel,item.flightNumber,
            item.station,item.group].map(s).join(' ').toLowerCase();
  }
  function applyFilters(list){
    const st = state.station;
    const q  = norm(state.search);
    return (Array.isArray(list) ? list : []).filter(item => {
      if (st && st !== 'all'){
        const is = stationOf(item);
        if (is && is !== st) return false;
      }
      if (q && !blob(item).includes(q)) return false;
      return true;
    });
  }
  function getTab(key){ return Array.isArray(state.data.tabs[key]) ? state.data.tabs[key] : []; }

  /* ── Rendering ── */
  function renderCard(item, type){
    const time    = type === 'checkin' ? hhmm(item.dropoffDateTime||item.end) : hhmm(item.pickupDateTime||item.start);
    const name    = esc(item.customerName||item.name||'—');
    const booking = esc(item.bookingNumber||item._id||item.id||'');
    const vehicle = s(item.assignedVehicleLabel||item.assignedVehiclePlate||item.vehicleLabel||'');
    const pickup  = esc(item.pickuppoint||item.station||'');
    const dropoff = esc(item.dropoffpoint||'');
    const flight  = s(item.flightNumber||item.flight||'');
    const isAirport = (s(item.pickuppoint)+' '+s(item.dropoffpoint)+' '+s(item.station)).toLowerCase().includes('airport') || !!flight;
    const noVehicle = !vehicle;
    const noFlight  = isAirport && !flight;
    const id = s(item._id||item.id||'');

    const tags = [];
    if (vehicle)   tags.push(`<span class="rb-tag ok">${esc(vehicle)}</span>`);
    else           tags.push(`<span class="rb-tag warn">No vehicle</span>`);
    if (isAirport && flight)  tags.push(`<span class="rb-tag info">&#9992; ${esc(flight)}</span>`);
    if (noFlight)  tags.push(`<span class="rb-tag warn">No flight</span>`);
    if (pickup)    tags.push(`<span class="rb-tag">${pickup}${dropoff ? ' &#8594; '+dropoff : ''}</span>`);

    const eid = esc(id);
    const actions = [
      `<button class="rb-btn primary" onclick="window._rbAct('contract','${eid}')">Contract</button>`,
      `<button class="rb-btn" onclick="window._rbAct('bookings','${eid}')">Bookings</button>`,
      `<button class="rb-btn" onclick="window._rbAct('fleet','${eid}')">Fleet</button>`
    ];

    const timeHtml = time ? `<div class="rb-card-time">${esc(time)}</div>` : '';
    const sub = [booking, esc(vehicle)||pickup].filter(Boolean).join(' &middot; ');
    return `<div class="rb-card">
      ${timeHtml}
      <div class="rb-card-name">${name}</div>
      <div class="rb-card-sub">${sub}</div>
      <div class="rb-card-tags">${tags.join('')}</div>
      <div class="rb-card-actions">${actions.join('')}</div>
    </div>`;
  }

  window._rbAct = function(action, id){
    if (action === 'contract') postToWix({ type:'openContract',   bookingId:id });
    else if (action === 'bookings') postToWix({ type:'openOnBookings', bookingId:id });
    else if (action === 'fleet')    postToWix({ type:'openOnFleet',    bookingId:id });
  };

  function renderSummary(summary){
    if (!summary || !Object.keys(summary).length){ els.summaryGrid.innerHTML=''; return; }
    const defs = [
      {k:'checkout', label:'Check-outs'},
      {k:'checkin',  label:'Check-ins'},
      {k:'bookings', label:'Bookings'},
      {k:'overdue',  label:'Overdue'},
      {k:'requests', label:'Requests'},
      {k:'available',label:'Available'}
    ];
    els.summaryGrid.innerHTML = defs
      .filter(({k}) => summary[k] !== undefined && summary[k] !== null)
      .map(({k,label}) => `<div class="rb-scard"><div class="rb-sk">${esc(label)}</div><div class="rb-sv">${esc(String(summary[k]||0))}</div></div>`)
      .join('');
  }

  function renderCol(bodyEl, cntEl, items, type){
    if (!bodyEl) return;
    if (cntEl) cntEl.textContent = String(items.length);
    if (!items.length){
      bodyEl.innerHTML = '<div class="rb-empty">&#916;&#949;&#957; &#965;&#960;&#940;&#961;&#967;&#959;&#965;&#957; &#948;&#949;&#948;&#959;&#956;&#941;&#957;&#945;.</div>';
      return;
    }
    bodyEl.innerHTML = items.map(item => renderCard(item, type)).join('');
  }

  function renderStations(stations){
    if (!Array.isArray(stations) || !stations.length) return;
    const cur = els.station.value;
    while (els.station.options.length > 1) els.station.remove(1);
    stations.forEach(st => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = st;
      els.station.appendChild(opt);
    });
    if (cur && cur !== 'all') els.station.value = cur;
  }

  function render(){
    const out      = applyFilters(getTab('checkout'));
    const inn      = applyFilters(getTab('checkin'));
    const rawBook  = getTab('bookings');
    const hasDedicated = rawBook.length > 0;
    const bookSrc  = hasDedicated ? rawBook : [...getTab('checkout'), ...getTab('checkin')];
    const bookings = applyFilters(bookSrc);

    if (els.bookingsLabel)
      els.bookingsLabel.textContent = hasDedicated ? 'Bookings' : "All Today's Ops";

    renderCol(els.listOut,      els.cntOut,      out,      'checkout');
    renderCol(els.listIn,       els.cntIn,       inn,      'checkin');
    renderCol(els.listBookings, els.cntBookings, bookings, hasDedicated ? 'bookings' : 'all');
    renderSummary(state.data.summary);

    try{
      const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      postToWix({ type:'resizeShell', height:h });
    }catch(_){}
  }

  /* ── Controls ── */
  $('btnPrev').addEventListener('click', () => { els.datePick.value = addDays(els.datePick.value||ymd(new Date()), -1); reloadData(); });
  $('btnNext').addEventListener('click', () => { els.datePick.value = addDays(els.datePick.value||ymd(new Date()),  1); reloadData(); });
  $('btnToday').addEventListener('click', () => { els.datePick.value = ymd(new Date()); reloadData(); });
  $('btnRefresh').addEventListener('click', () => reloadData());
  $('datePick').addEventListener('change', () => reloadData());
  $('globalSearch').addEventListener('input', () => { state.search = els.search.value; render(); });
  $('stationFilter').addEventListener('change', () => { state.station = els.station.value; render(); });

  /* ── Sidebar nav ── */
  document.querySelectorAll('[data-route]').forEach(btn =>
    btn.addEventListener('click', () => postToWix({ type:'navigate', route:btn.getAttribute('data-route') }))
  );

  /* ── User menu ── */
  const menuBtn = $('userMenuBtn');
  const menu    = $('userMenu');
  if (menuBtn && menu){
    menuBtn.parentElement.style.display = '';
    menuBtn.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click', e => {
      if (!menu.contains(e.target) && !menuBtn.contains(e.target)) menu.classList.remove('open');
    });
    menu.querySelectorAll('[data-menu-action]').forEach(node =>
      node.addEventListener('click', () => {
        postToWix({ type:'menuAction', action:node.getAttribute('data-menu-action') });
        menu.classList.remove('open');
      })
    );
  }

  /* ── Trusted-origin check ── */
  const TRUSTED = ['wix.com','wixsite.com','parastorage.com','wixstatic.com'];
  function isTrusted(origin){
    const raw = s(origin).toLowerCase();
    if (!raw) return true;
    try{
      const host = new URL(raw).hostname.toLowerCase();
      if (!host) return false;
      if (TRUSTED.some(t => host === t || host.endsWith('.'+t))) return true;
      try{ const rh = new URL(document.referrer).hostname.toLowerCase(); if(rh && rh === host) return true; }catch(_){}
      return false;
    }catch(_){ return false; }
  }

  /* ── postMessage handler ── */
  window.addEventListener('message', event => {
    if (event.origin && !isTrusted(event.origin)) return;
    const d = event.data || {};
    if (!d || !d.type) return;

    /* resume: parent tells us to refresh to today */
    if (d.type === 'resume'){
      const today = ymd(new Date());
      if (!els.datePick.value || els.datePick.value !== today){
        els.datePick.value = today;
        reloadData();
      }
      return;
    }

    /* loadDailyOps: main data payload */
    if (d.type === 'loadDailyOps'){
      const tabs = d.tabs || {};

      /* Normalise checkout — try every key name the backend might use */
      if (!Array.isArray(tabs.checkout) || !tabs.checkout.length){
        const alt = d.checkOut || d.checkout || d.CheckOut;
        if (Array.isArray(alt) && alt.length) tabs.checkout = alt;
      }
      /* Normalise checkin */
      if (!Array.isArray(tabs.checkin) || !tabs.checkin.length){
        const alt = d.checkIn || d.checkin || d.CheckIn;
        if (Array.isArray(alt) && alt.length) tabs.checkin = alt;
      }
      /* Normalise bookings */
      if (!Array.isArray(tabs.bookings) || !tabs.bookings.length){
        const alt = d.bookings || d.Bookings;
        if (Array.isArray(alt) && alt.length) tabs.bookings = alt;
      }

      state.data = {
        tabs,
        summary:  d.summary  || {},
        stations: Array.isArray(d.stations) ? d.stations : []
      };

      renderStations(state.data.stations);

      const nOut  = (tabs.checkout||[]).length;
      const nIn   = (tabs.checkin||[]).length;
      const nBook = (tabs.bookings||[]).length;
      const nOver = state.data.summary.overdue || 0;
      setStatus(`OK • out=${nOut} in=${nIn} bookings=${nBook} overdue=${nOver}`);

      render();
      return;
    }

    /* userContext / backroomUserContext */
    if (d.type === 'userContext' || d.type === 'backroomUserContext'){
      const u    = d.user || d.identity || d || {};
      const role = d.role || d.currentRole || d || {};
      state.user.name = s(u.displayName||u.fullName||u.name||u.email||d.fullName||d.name||d.email||'Operator');
      state.user.role = s(role.label||role.roleLabel||role.name||d.roleLabel||d.role||'Backroom');

      document.querySelectorAll('#menuUserName,#menuUserName2').forEach(el => el.textContent = state.user.name);
      document.querySelectorAll('#menuUserRole,#menuUserRole2').forEach(el => el.textContent = state.user.role);
      const badge = $('userBadge');
      if (badge) badge.textContent = state.user.name.slice(0,2).toUpperCase();
      const today = $('todayMeta');
      if (today){ try{ today.textContent = new Date().toLocaleDateString('el-GR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(_){} }
      if (menuBtn) menuBtn.parentElement.style.display = '';

      const can = d.canNavigate || {};
      document.querySelectorAll('[data-route]').forEach(btn => {
        const r = btn.getAttribute('data-route');
        if (Object.prototype.hasOwnProperty.call(can, r) && !can[r]) btn.style.display='none';
      });
      return;
    }
  });

  /* ── Auto-init: request user context + load today immediately ── */
  postToWix({ type:'requestUserContext' });
  els.datePick.value = ymd(new Date());
  reloadData();

})();
</script>
</body>
</html>
