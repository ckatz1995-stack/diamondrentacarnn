<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#F0F4FA;--surface:#FFFFFF;--surface2:#E8EEF7;
      --border:rgba(15,23,42,.08);--border2:rgba(15,23,42,.15);
      --text:#0F172A;--sub:#475569;--muted:#94A3B8;
      --gold:#A8844A;--gold2:#6C522E;
      --gold-bg:rgba(180,138,79,.10);--gold-border:rgba(168,132,74,.22);
      --ok:#166534;--warn:#92400E;--danger:#991B1B;--info:#1E3A8A;
      --shadow:0 2px 12px rgba(15,23,42,.06);--shadow-lg:0 8px 28px rgba(15,23,42,.14);
      --r:14px;--r-pill:999px;--sb-w:220px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    body{overflow:hidden}
    .hidden{display:none!important}

    /* ── Shell & Sidebar ── */
    .shell{display:flex;height:100vh;overflow:hidden}
    .shell-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .shell-content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:14px 18px}
    .shell-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;min-height:62px;position:relative;z-index:20}
    .shell-topdate{font:700 12px/1 system-ui;color:var(--muted)}
    .shell-page-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
    .shell-page-name{display:flex;align-items:center;gap:9px;font:900 15px/1.2 system-ui,-apple-system,sans-serif;color:var(--text);letter-spacing:-.01em}
    .shell-page-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--gold-bg);border:1px solid var(--gold-border);flex:0 0 28px;color:var(--gold)}
    .shell-page-icon svg{width:14px;height:14px}
    .shell-page-sub{font:700 11px/1 system-ui;color:var(--muted);padding-left:37px}
    .shell-top-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
    .sb{width:var(--sb-w);flex:0 0 var(--sb-w);display:flex;flex-direction:column;height:100vh;overflow:hidden;background:linear-gradient(180deg,#2a1f0e 0%,#3d2b12 55%,#4f3a22 100%)}
    .sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.08)}
    .sb-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font:900 17px/1 system-ui;flex:0 0 36px}
    .sb-brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
    .sb-brand-name{font:900 13px/1.2 system-ui;color:#FEFCF7;letter-spacing:-.01em}
    .sb-brand-sub{font:700 10px/1 system-ui;color:rgba(255,255,255,.45);margin-top:2px}
    .sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
    .sb-nav::-webkit-scrollbar{display:none}
    .sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.62);cursor:pointer;transition:all .16s;text-align:left;width:100%;font:700 13px/1.2 system-ui,-apple-system,sans-serif;appearance:none}
    .sb-item:hover{background:rgba(255,255,255,.08);color:#FEFCF7;border-color:rgba(255,255,255,.1)}
    .sb-item.active{background:linear-gradient(135deg,rgba(168,132,74,.22),rgba(168,132,74,.10));color:var(--gold);border-color:rgba(168,132,74,.22);font-weight:900}
    .sb-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.75}
    .sb-item.active svg{opacity:1}
    .sb-item-label{flex:1;min-width:0;font-size:13px}
    .sb-section{font:900 9px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:12px 12px 4px;margin-top:2px;pointer-events:none}
    .sb-footer{flex:0 0 auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,.08)}
    .shell-content::-webkit-scrollbar{width:5px}
    .shell-content::-webkit-scrollbar-track{background:transparent}
    .shell-content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
    .userWrap,.userMenuWrap{position:relative;display:inline-flex;align-items:center;flex:0 0 auto;overflow:visible;z-index:6}
    .userBtn,.userMenuBtn{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--border2);background:rgba(15,23,42,.04);border-radius:var(--r-pill);cursor:pointer;font:900 12px/1.1 system-ui;color:var(--text);transition:all .15s}
    .userBtn:hover,.userMenuBtn:hover{background:rgba(15,23,42,.08)}
    .userBadge{width:28px;height:28px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--gold-bg);color:var(--gold);font:900 13px/1 system-ui;border:1px solid var(--gold-border)}
    .userText{display:flex;flex-direction:column;align-items:flex-start}
    .userName{font-weight:900;font-size:13px;color:var(--text)}
    .userRole{font-size:11px;color:var(--muted);font-weight:700}
    .caret{font-size:10px;color:var(--muted)}
    .menu,.userMenu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow-lg);display:none;z-index:999999;overflow:hidden}
    .menu.open,.userMenu.open{display:block}
    .menuHead,.userMenuHead{padding:12px 14px;background:var(--gold-bg);border-bottom:1px solid var(--gold-border)}
    .menuItem,.userMenuItem{padding:11px 14px;font:800 13px/1.2 system-ui;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;width:100%;transition:background .12s}
    .menuItem:last-child,.userMenuItem:last-child{border-bottom:none}
    .menuItem:hover,.userMenuItem:hover{background:rgba(15,23,42,.05)}
    .menuItem.danger,.userMenuItem.danger{color:#B91C1C}
    .menuItem.danger:hover,.userMenuItem.danger:hover{background:rgba(239,68,68,.08)}
    @media(max-width:900px){
      .sb{width:60px;flex:0 0 60px}
      .sb-brand-text,.sb-item-label,.sb-brand-sub,.sb-section{display:none}
      .sb-brand{justify-content:center;padding:14px 0}
      .sb-item{justify-content:center;padding:10px}
      .sb-item svg{flex:0 0 22px;width:22px;height:22px}
      .shell-content{padding:10px 12px}
    }

    /* ── Shared ── */
    .btn{appearance:none;border:1px solid var(--border2);background:rgba(0,0,0,.04);color:var(--sub);border-radius:12px;padding:7px 10px;font:800 10.5px/1 system-ui,-apple-system,sans-serif;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s}
    .btnPrimary{background:linear-gradient(135deg,var(--gold),#C8952E);color:#1a1208;border-color:transparent;box-shadow:0 2px 8px rgba(154,110,30,.22)}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .btnPrimary:hover{box-shadow:0 4px 14px rgba(154,110,30,.34)!important}
    .input,.select{appearance:none;border:1px solid var(--border2);background:var(--surface2);border-radius:10px;padding:7px 9px;font:800 11px/1.2 system-ui,-apple-system,sans-serif;color:var(--text);outline:none}
    .input:focus,.select:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(154,110,30,.12)}
    .surface{background:var(--surface);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow)}

    /* ── Controls ── */
    .rb-controls{padding:10px 14px 8px;margin-bottom:10px}
    .rb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .rb-row+.rb-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
    .rb-status{padding:5px 10px;border:1px solid var(--border2);border-radius:10px;background:rgba(0,0,0,.03);font:800 10px/1.35 system-ui;color:var(--sub);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rb-refresh-time{font:700 10px/1 system-ui;color:var(--muted);white-space:nowrap;flex-shrink:0}
    .rb-auto-label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border2);border-radius:10px;background:rgba(0,0,0,.03);font:800 10.5px/1 system-ui;color:var(--sub);cursor:pointer;user-select:none;white-space:nowrap}
    .rb-auto-label input{accent-color:var(--gold)}
    .rb-auto-label.is-on{border-color:var(--gold-border);color:var(--gold);background:var(--gold-bg)}

    /* countdown chip */
    .rb-countdown{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--r-pill);background:rgba(0,0,0,.03);font:900 10px/1 system-ui;color:var(--sub);white-space:nowrap;flex-shrink:0;transition:all .3s}
    .rb-countdown.urgent{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.22);color:#B91C1C}

    /* ── Quick filters ── */
    .rb-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .rb-filter-label{font:900 9px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
    .rb-fchip{appearance:none;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--r-pill);background:rgba(0,0,0,.03);font:900 10px/1 system-ui;color:var(--sub);cursor:pointer;transition:all .14s;white-space:nowrap}
    .rb-fchip:hover{background:rgba(0,0,0,.06)}
    .rb-fchip.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
    .rb-fchip.fc-airport.active{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.22);color:#1D4ED8}
    .rb-fchip.fc-novehicle.active,.rb-fchip.fc-noflight.active{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.22);color:#B45309}
    .rb-fchip.fc-overdue.active{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.22);color:#B91C1C}

    /* ── Timeline ── */
    .rb-timeline{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:10px 16px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
    .tl-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
    .tl-title{font:900 9.5px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .tl-legend{display:flex;gap:12px;align-items:center}
    .tl-leg{display:inline-flex;align-items:center;gap:5px;font:800 10px/1 system-ui;color:var(--sub)}
    .tl-leg::before{content:"";width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .tl-leg.checkout::before{background:var(--gold)}
    .tl-leg.checkin::before{background:#10B981}
    .tl-axis{position:relative;height:64px;margin:0 8px;user-select:none}
    .tl-line{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--border2);border-radius:2px;transform:translateY(-50%)}
    .tl-tick{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
    .tl-tick::before{content:"";width:1px;height:7px;background:var(--border2)}
    .tl-tick span{font:700 8px/1 system-ui;color:var(--muted);white-space:nowrap}
    .tl-dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);cursor:pointer;transition:transform .14s,box-shadow .14s;z-index:2}
    .tl-dot:hover{transform:translateX(-50%) scale(2);z-index:10}
    .tl-dot.co{top:calc(50% - 18px);background:var(--gold);box-shadow:0 0 0 2px rgba(168,132,74,.25)}
    .tl-dot.ci{top:calc(50% + 8px);background:#10B981;box-shadow:0 0 0 2px rgba(16,185,129,.22)}
    .tl-dot.crit{background:#EF4444!important;box-shadow:0 0 0 2px rgba(239,68,68,.3)!important}
    .tl-now{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--gold);transform:translateX(-50%);border-radius:2px;z-index:5;pointer-events:none}
    .tl-now::after{content:"NOW";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:900 7.5px/1 system-ui;color:var(--gold);letter-spacing:.04em}

    /* ── KPI summary ── */
    .rb-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:10px}
    .rb-scard{padding:14px 16px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .rb-scard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--border2);border-radius:0 3px 3px 0}
    .rb-scard.sc-danger{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04)}
    .rb-scard.sc-danger::before{background:#EF4444}
    .rb-scard.sc-warn{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.04)}
    .rb-scard.sc-warn::before{background:#F59E0B}
    .rb-scard.sc-ok::before{background:#10B981}
    .rb-scard.sc-info::before{background:#3B82F6}
    .rb-sk{font:900 9.5px/1 system-ui;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .rb-sv{font:900 28px/1 system-ui;color:var(--text);letter-spacing:-.02em;margin-top:4px}
    .rb-scard.sc-danger .rb-sv{color:#B91C1C}
    .rb-scard.sc-warn .rb-sv{color:#B45309}

    /* ── Stats bar ── */
    .rb-stats-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow)}
    .rb-stat-label{font:900 9px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .rb-stat-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:var(--r-pill);border:1px solid var(--border);background:rgba(0,0,0,.03);font:800 10px/1 system-ui;color:var(--sub)}
    .rb-stat-chip strong{font-weight:900;color:var(--text)}
    .rb-stat-chip.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.20);color:#1D4ED8}
    .rb-stat-chip.info strong{color:#1D4ED8}
    .rb-stat-chip.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.20);color:#B45309}
    .rb-stat-chip.warn strong{color:#B45309}
    .rb-stat-chip.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.20);color:#065F46}
    .rb-stat-chip.ok strong{color:#065F46}
    .rb-stat-chip.note{background:rgba(168,132,74,.08);border-color:var(--gold-border);color:var(--gold2)}
    .rb-stat-chip.note strong{color:var(--gold2)}

    /* ── Overdue alert banner ── */
    .rb-overdue-banner{display:none;align-items:center;gap:10px;padding:9px 14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);border-radius:12px;margin-bottom:12px}
    .rb-overdue-banner.show{display:flex}
    .rb-overdue-dot{width:8px;height:8px;border-radius:50%;background:#EF4444;flex-shrink:0;animation:pulse-dot 1.4s infinite}
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
    .rb-overdue-text{font:900 11px/1.35 system-ui;color:#B91C1C;flex:1}
    .rb-overdue-btn{appearance:none;border:1px solid rgba(239,68,68,.30);background:rgba(239,68,68,.10);border-radius:8px;padding:5px 10px;font:900 10px/1 system-ui;color:#B91C1C;cursor:pointer}

    /* ── Board ── */
    .rb-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start;margin-bottom:20px}
    .rb-col{background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
    .rb-colhead{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:6px;position:sticky;top:0;z-index:2}
    .rb-colhead-left{display:flex;align-items:center;gap:6px;min-width:0}
    .rb-colhead-left strong{font:900 11px/1 system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--text)}
    .rb-badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.04);border:1px solid var(--border);font:900 10px/1 system-ui;color:var(--sub)}
    .rb-colhead-sort{display:flex;gap:3px;align-items:center;flex-shrink:0}
    .rb-sort-btn{appearance:none;border:1px solid var(--border);background:transparent;border-radius:6px;padding:3px 6px;font:900 9px/1 system-ui;color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap}
    .rb-sort-btn:hover{background:rgba(0,0,0,.05);color:var(--sub)}
    .rb-sort-btn.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
    .rb-colbody{display:flex;flex-direction:column;gap:0;max-height:70vh;overflow-y:auto}
    .rb-colbody::-webkit-scrollbar{width:4px}
    .rb-colbody::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
    #colOut{border-top:3px solid var(--gold)}
    #colIn{border-top:3px solid #10B981}
    #colBookings{border-top:3px solid var(--gold2)}

    /* ── Cards ── */
    .rb-card{padding:12px 12px 12px 17px;border-bottom:1px solid var(--border);position:relative;transition:background .12s}
    .rb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border2);border-radius:0}
    .rb-card.card-ok::before{background:#10B981}
    .rb-card.card-warn::before{background:#F59E0B}
    .rb-card.card-crit::before{background:#EF4444}
    .rb-card:last-child{border-bottom:none}
    .rb-card:hover{background:rgba(0,0,0,.018)}

    /* card header row — click to expand */
    .rb-card-header{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;margin-bottom:7px}
    .rb-card-header-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
    .rb-card-time{display:inline-flex;align-items:center;padding:4px 9px;border-radius:9px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);font:900 12px/1 system-ui}
    .rb-card-time.urgent{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.22);color:#B91C1C}
    .rb-badge-ap{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:var(--r-pill);background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.22);color:#1D4ED8;font:900 9px/1 system-ui}
    .rb-badge-pd{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:var(--r-pill);background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.22);color:#B45309;font:900 9px/1 system-ui}
    .rb-badge-ov{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:var(--r-pill);background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.22);color:#B91C1C;font:900 9px/1 system-ui}
    .rb-expand-btn{appearance:none;border:none;background:transparent;color:var(--muted);font:900 10px/1 system-ui;cursor:pointer;padding:4px 5px;border-radius:6px;flex-shrink:0;transition:all .12s}
    .rb-expand-btn:hover{background:rgba(0,0,0,.06);color:var(--sub)}

    .rb-card-name{font:900 13px/1.3 system-ui;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rb-card-booking{font:800 10px/1.2 system-ui;color:var(--muted);margin-top:1px;letter-spacing:.02em}
    .rb-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .rb-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:var(--r-pill);font:900 9px/1 system-ui;border:1px solid var(--border);background:rgba(0,0,0,.03);color:var(--sub)}
    .rb-tag.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.22);color:#B45309}
    .rb-tag.info{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.22);color:#1D4ED8}
    .rb-tag.ok{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.22);color:#065F46}
    .rb-tag.crit{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.22);color:#B91C1C}

    /* notes preview (always visible if notes exist) */
    .rb-notes-preview{margin-top:6px;padding:5px 8px;background:rgba(168,132,74,.06);border-left:2px solid var(--gold-border);border-radius:0 6px 6px 0;font:800 10px/1.45 system-ui;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* expandable details */
    .rb-card-details{max-height:0;overflow:hidden;transition:max-height .25s ease}
    .rb-card.expanded .rb-card-details{max-height:400px}
    .rb-detail-section{padding:10px 0 4px;border-top:1px solid var(--border);margin-top:9px;display:flex;flex-direction:column;gap:7px}
    .rb-contact-row{display:flex;gap:6px;flex-wrap:wrap}
    .rb-contact-link{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.02);font:800 10.5px/1 system-ui;color:var(--sub);text-decoration:none;transition:all .12s}
    .rb-contact-link:hover{background:rgba(0,0,0,.06);color:var(--text)}
    .rb-notes-full{font:800 10.5px/1.5 system-ui;color:var(--sub);padding:8px 10px;background:rgba(0,0,0,.025);border-radius:8px;border-left:2px solid var(--gold-border);white-space:pre-wrap;word-break:break-word}
    .rb-detail-extra{display:flex;gap:10px;flex-wrap:wrap}
    .rb-detail-field{display:flex;flex-direction:column;gap:2px}
    .rb-detail-key{font:900 8.5px/1 system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .rb-detail-val{font:800 11px/1.3 system-ui;color:var(--sub)}

    .rb-card-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .rb-btn{appearance:none;border:1px solid var(--border);background:rgba(0,0,0,.03);border-radius:8px;padding:5px 10px;font:900 9.5px/1 system-ui;color:var(--sub);cursor:pointer;transition:all .14s}
    .rb-btn:hover{background:rgba(0,0,0,.07);transform:translateY(-1px);box-shadow:var(--shadow)}
    .rb-btn.primary{background:linear-gradient(135deg,var(--gold),#C8952E);color:#1a1208;border-color:transparent;box-shadow:0 2px 6px rgba(154,110,30,.22)}
    .rb-btn.primary:hover{box-shadow:0 4px 12px rgba(154,110,30,.34)}
    .rb-empty{padding:32px 16px;text-align:center;font:800 11.5px/1.6 system-ui;color:var(--muted)}

    @media(max-width:980px){.rb-board{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.rb-board{grid-template-columns:1fr}.rb-row{gap:6px}.tl-axis{height:50px}}
  </style>

<script>
(function(){
  'use strict';

  const $ = (id) => document.getElementById(id);

  const els = {
    status:        $('status'),
    datePick:      $('datePick'),
    station:       $('stationFilter'),
    search:        $('globalSearch'),
    summaryGrid:   $('summaryGrid'),
    statsBar:      $('statsBar'),
    listOut:       $('listOut'),
    listIn:        $('listIn'),
    listBookings:  $('listBookings'),
    cntOut:        $('cntOut'),
    cntIn:         $('cntIn'),
    cntBookings:   $('cntBookings'),
    bookingsLabel: $('bookingsColLabel'),
    refreshTime:   $('refreshTime'),
    autoLabel:     $('autoLabel'),
    autoCheck:     $('autoRefresh'),
    countdown:     $('countdown'),
    overdueBanner: $('overdueBanner'),
    overdueText:   $('overdueText'),
    tlAxis:        $('tlAxis')
  };

  const state = {
    data:        { tabs:{}, summary:{}, stations:[] },
    search:      '',
    station:     'all',
    quickFilter: 'all',
    sort:        { out:{key:'time',dir:'asc'}, in:{key:'time',dir:'asc'}, bookings:{key:'time',dir:'asc'} },
    autoTimer:   null,
    cdTimer:     null,
    user:        { name:'Operator', role:'Backroom' }
  };

  /* ── Utilities ── */
  function s(v){ return String(v ?? '').trim(); }
  function esc(v){ return s(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function asDate(v){ const d=new Date(v); return isNaN(d.getTime())?null:d; }
  function ymd(v){ const d=asDate(v)||new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function hhmm(v){ const d=asDate(v); if(!d) return ''; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function addDays(str,n){ const d=asDate(str)||new Date(); d.setDate(d.getDate()+n); return ymd(d); }
  function postToWix(p){ try{ window.parent.postMessage(p,'*'); }catch(_){} }
  function setStatus(t){ if(els.status) els.status.textContent=s(t); }
  function stampRefresh(){ if(els.refreshTime){ const n=new Date(); els.refreshTime.textContent=`Updated ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; } }

  /* ── Data request ── */
  function reloadData(){
    const d = els.datePick.value || ymd(new Date());
    postToWix({ type:'requestDailyData', date:d, startISO:new Date(d+'T00:00:00').toISOString(), endISO:new Date(d+'T23:59:59').toISOString() });
    setStatus('Loading…');
  }

  /* ── Item predicates ── */
  function norm(v){ return s(v).toLowerCase(); }
  function stationOf(item){ return s(item.station||item.pickupStation||item.dropoffStation||item.pickuppoint||item.dropoffpoint||''); }
  function isAirport(item){
    const r=(s(item.pickuppoint)+' '+s(item.dropoffpoint)+' '+s(item.station)).toLowerCase();
    return r.includes('airport')||r.includes('αεροδ')||!!s(item.flightNumber||item.flight||'');
  }
  function hasVehicle(item){ return !!s(item.assignedVehicleLabel||item.assignedVehiclePlate||item.vehicleLabel||''); }
  function hasFlight(item){ return !!s(item.flightNumber||item.flight||''); }
  function isPending(item){ return ['pending','request','requested','new','quote','unconfirmed','hold','waiting'].includes(norm(item.status||'')); }
  function isOverdue(item){ const st=norm(item.status||''); return st.includes('overdue')||st.includes('late'); }
  function hasNotes(item){ return !!s(item.notes||item.note||item.remarks||item.memo||''); }
  function getPhone(item){ return s(item.phone||item.mobile||item.customerPhone||item.tel||''); }
  function getEmail(item){ return s(item.email||item.customerEmail||''); }
  function getAgent(item){ return s(item.agent||item.agentName||item.assignedAgent||''); }
  function getNotes(item){ return s(item.notes||item.note||item.remarks||item.memo||''); }
  function getVehicleDetail(item){ return [s(item.assignedVehicleModel||item.vehicleModel||''),s(item.assignedVehiclePlate||item.vehiclePlate||'')].filter(Boolean).join(' · '); }

  function blob(item){
    return [item.bookingNumber,item.customerName,item.name,item.phone,item.mobile,item.email,
            item.pickuppoint,item.dropoffpoint,item.assignedVehicleLabel,item.assignedVehiclePlate,
            item.assignedVehicleModel,item.flightNumber,item.station,item.group,item.notes,item.agent]
      .map(s).join(' ').toLowerCase();
  }

  /* ── Quick filter ── */
  function matchesQuickFilter(item){
    switch(state.quickFilter){
      case 'airport':   return isAirport(item);
      case 'novehicle': return !hasVehicle(item);
      case 'noflight':  return isAirport(item)&&!hasFlight(item);
      case 'overdue':   return isOverdue(item);
      default:          return true;
    }
  }

  /* ── Filters ── */
  function applyFilters(list){
    const st=state.station; const q=norm(state.search);
    return (Array.isArray(list)?list:[]).filter(item=>{
      if(st&&st!=='all'){ const is=stationOf(item); if(is&&is!==st) return false; }
      if(q&&!blob(item).includes(q)) return false;
      if(!matchesQuickFilter(item)) return false;
      return true;
    });
  }

  function getTab(key){ return Array.isArray(state.data.tabs[key])?state.data.tabs[key]:[]; }

  /* ── Sorting ── */
  function itemTime(item, colId){
    if(colId==='in') return asDate(item.dropoffDateTime||item.end)||new Date(0);
    return asDate(item.pickupDateTime||item.start||item.dropoffDateTime||item.end)||new Date(0);
  }
  function urgencyScore(item){
    if(isOverdue(item)) return 0;
    if(!hasVehicle(item)&&isAirport(item)) return 1;
    if(!hasVehicle(item)) return 2;
    if(isAirport(item)&&!hasFlight(item)) return 3;
    return 4;
  }
  function sortItems(items, colId){
    const {key,dir}=state.sort[colId]||{key:'time',dir:'asc'};
    const m=dir==='asc'?1:-1;
    return [...items].sort((a,b)=>{
      if(key==='time') return (itemTime(a,colId)-itemTime(b,colId))*m;
      if(key==='name') return s(a.customerName||a.name||'').localeCompare(s(b.customerName||b.name||''))*m;
      if(key==='status') return (urgencyScore(a)-urgencyScore(b))*m;
      return 0;
    });
  }

  /* ── Card urgency class ── */
  function cardClass(item){
    if(isOverdue(item)) return 'card-crit';
    if(!hasVehicle(item)&&isAirport(item)) return 'card-crit';
    if(!hasVehicle(item)) return 'card-warn';
    if(isAirport(item)&&!hasFlight(item)) return 'card-warn';
    return 'card-ok';
  }

  /* ── Render card ── */
  function renderCard(item, type){
    const time    = type==='checkin'?hhmm(item.dropoffDateTime||item.end):hhmm(item.pickupDateTime||item.start);
    const name    = esc(item.customerName||item.name||'—');
    const booking = esc(item.bookingNumber||'');
    const vehicle = s(item.assignedVehicleLabel||item.assignedVehiclePlate||item.vehicleLabel||'');
    const pickup  = esc(item.pickuppoint||item.station||'');
    const dropoff = esc(item.dropoffpoint||'');
    const flight  = s(item.flightNumber||item.flight||'');
    const airport = isAirport(item);
    const overdue = isOverdue(item);
    const pending = isPending(item);
    const notes   = getNotes(item);
    const phone   = getPhone(item);
    const email   = getEmail(item);
    const agent   = getAgent(item);
    const vDetail = getVehicleDetail(item);
    const id      = s(item._id||item.id||'');
    const eid     = esc(id);
    const cls     = cardClass(item);

    /* header chips */
    const chips=[];
    if(time) chips.push(`<span class="rb-card-time${overdue?' urgent':''}">${esc(time)}</span>`);
    if(airport) chips.push(`<span class="rb-badge-ap">&#9992; Airport</span>`);
    if(overdue) chips.push(`<span class="rb-badge-ov">&#9210; Overdue</span>`);
    else if(pending) chips.push(`<span class="rb-badge-pd">&#9679; Pending</span>`);

    /* tags */
    const tags=[];
    if(vehicle)             tags.push(`<span class="rb-tag ok">&#128663; ${esc(vehicle)}</span>`);
    else                    tags.push(`<span class="rb-tag crit">&#9888; No vehicle</span>`);
    if(airport&&flight)     tags.push(`<span class="rb-tag info">&#9992; ${esc(flight)}</span>`);
    if(airport&&!flight)    tags.push(`<span class="rb-tag warn">No flight #</span>`);
    if(pickup)              tags.push(`<span class="rb-tag">${pickup}${dropoff?' &#8594; '+dropoff:''}</span>`);

    /* expandable details */
    const detailParts=[];
    if(phone||email){
      const links=[];
      if(phone) links.push(`<a class="rb-contact-link" href="tel:${esc(phone)}">&#128222; ${esc(phone)}</a>`);
      if(email) links.push(`<a class="rb-contact-link" href="mailto:${esc(email)}">&#9993; ${esc(email)}</a>`);
      detailParts.push(`<div class="rb-contact-row">${links.join('')}</div>`);
    }
    if(notes) detailParts.push(`<div class="rb-notes-full">&#128203; ${esc(notes)}</div>`);
    const extras=[];
    if(vDetail) extras.push(`<div class="rb-detail-field"><div class="rb-detail-key">Vehicle</div><div class="rb-detail-val">${esc(vDetail)}</div></div>`);
    if(agent)   extras.push(`<div class="rb-detail-field"><div class="rb-detail-key">Agent</div><div class="rb-detail-val">${esc(agent)}</div></div>`);
    if(extras.length) detailParts.push(`<div class="rb-detail-extra">${extras.join('')}</div>`);

    const hasDetails = detailParts.length > 0;
    const notesPreview = notes ? `<div class="rb-notes-preview">&#128203; ${esc(notes.length>100?notes.slice(0,100)+'…':notes)}</div>` : '';

    return `<div class="rb-card ${cls}" id="rbc-${eid}">
      <div class="rb-card-header" onclick="window._rbToggle('${eid}',event)">
        <div class="rb-card-header-chips">${chips.join('')}</div>
        ${hasDetails?`<button class="rb-expand-btn" type="button">&#9660;</button>`:''}
      </div>
      <div class="rb-card-name">${name}</div>
      ${booking?`<div class="rb-card-booking">${booking}</div>`:''}
      <div class="rb-card-tags">${tags.join('')}</div>
      ${notesPreview}
      ${hasDetails?`<div class="rb-card-details"><div class="rb-detail-section">${detailParts.join('')}</div></div>`:''}
      <div class="rb-card-actions">
        <button class="rb-btn primary" onclick="window._rbAct('contract','${eid}')">Contract</button>
        <button class="rb-btn" onclick="window._rbAct('bookings','${eid}')">Bookings</button>
        <button class="rb-btn" onclick="window._rbAct('fleet','${eid}')">Fleet</button>
      </div>
    </div>`;
  }

  /* ── Global actions ── */
  window._rbAct = function(action,id){
    if(action==='contract')  postToWix({type:'openContract',bookingId:id});
    else if(action==='bookings') postToWix({type:'openOnBookings',bookingId:id});
    else if(action==='fleet')    postToWix({type:'openOnFleet',bookingId:id});
  };

  window._rbToggle = function(id, event){
    if(event&&event.target.closest('.rb-card-actions,.rb-btn')) return;
    const card = document.getElementById('rbc-'+id);
    if(!card) return;
    const expanded = card.classList.toggle('expanded');
    const btn = card.querySelector('.rb-expand-btn');
    if(btn) btn.innerHTML = expanded?'&#9650;':'&#9660;';
  };

  window._rbSetFilter = function(f){
    state.quickFilter=f;
    document.querySelectorAll('.rb-fchip').forEach(btn=>
      btn.classList.toggle('active', btn.getAttribute('data-filter')===f)
    );
    render();
  };

  /* ── KPI card variant ── */
  function scardClass(k,val){
    if(k==='overdue'&&Number(val)>0) return 'sc-danger';
    if(k==='requests'&&Number(val)>0) return 'sc-warn';
    if(k==='checkout'||k==='checkin') return 'sc-ok';
    if(k==='available') return 'sc-info';
    return '';
  }

  function renderSummary(summary){
    if(!summary||!Object.keys(summary).length){els.summaryGrid.innerHTML='';return;}
    const defs=[
      {k:'checkout',label:'Check-outs'},{k:'checkin',label:'Check-ins'},
      {k:'bookings',label:'Bookings'},{k:'overdue',label:'Overdue'},
      {k:'requests',label:'Requests'},{k:'available',label:'Available'}
    ];
    els.summaryGrid.innerHTML=defs
      .filter(({k})=>summary[k]!==undefined&&summary[k]!==null)
      .map(({k,label})=>{
        const val=summary[k]||0;
        return `<div class="rb-scard ${scardClass(k,val)}"><div class="rb-sk">${esc(label)}</div><div class="rb-sv">${esc(String(val))}</div></div>`;
      }).join('');
  }

  /* ── Stats bar ── */
  function renderStatsBar(){
    if(!els.statsBar) return;
    const all=[...getTab('checkout'),...getTab('checkin')];
    if(!all.length){els.statsBar.style.display='none';return;}
    els.statsBar.style.display='';
    const airportN  = all.filter(isAirport).length;
    const noVehicleN= all.filter(i=>!hasVehicle(i)).length;
    const notesN    = all.filter(hasNotes).length;
    const now = Date.now();
    const nextEv = all
      .map(i=>({t:asDate(i.pickupDateTime||i.dropoffDateTime||i.start||i.end),type:i.pickupDateTime?'checkout':'checkin'}))
      .filter(e=>e.t&&e.t.getTime()>now)
      .sort((a,b)=>a.t-b.t)[0]||null;
    const chips=[];
    chips.push(`<span class="rb-stat-label">Today:</span>`);
    chips.push(`<span class="rb-stat-chip ok">&#128197; Total ops: <strong>${all.length}</strong></span>`);
    if(airportN)   chips.push(`<span class="rb-stat-chip info">&#9992; Airport: <strong>${airportN}</strong></span>`);
    if(noVehicleN) chips.push(`<span class="rb-stat-chip warn">&#9888; No vehicle: <strong>${noVehicleN}</strong></span>`);
    if(notesN)     chips.push(`<span class="rb-stat-chip note">&#128203; With notes: <strong>${notesN}</strong></span>`);
    if(nextEv)     chips.push(`<span class="rb-stat-chip ok">&#9654; Next ${nextEv.type==='checkout'?'out':'in'}: <strong>${hhmm(nextEv.t)}</strong></span>`);
    els.statsBar.innerHTML=chips.join('');
  }

  /* ── Timeline ── */
  function renderTimeline(){
    if(!els.tlAxis) return;
    const START=6*60, END=23*60, RANGE=END-START;
    function pct(v){ return Math.max(0,Math.min(100,((v.getHours()*60+v.getMinutes())-START)/RANGE*100)).toFixed(1); }

    let html='<div class="tl-line"></div>';
    for(let h=6;h<=22;h+=2){
      const p=((h*60-START)/RANGE*100).toFixed(1);
      html+=`<div class="tl-tick" style="left:${p}%"><span>${h}:00</span></div>`;
    }
    const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    if(nowMin>=START&&nowMin<=END) html+=`<div class="tl-now" style="left:${((nowMin-START)/RANGE*100).toFixed(1)}%"></div>`;

    getTab('checkout').forEach(item=>{
      const d=asDate(item.pickupDateTime||item.start); if(!d) return;
      const p=pct(d), title=`${esc(item.customerName||item.name||'—')} · ${hhmm(d)}`;
      const crit=!hasVehicle(item)?'crit':'';
      html+=`<div class="tl-dot co ${crit}" style="left:${p}%" title="${title}"></div>`;
    });
    getTab('checkin').forEach(item=>{
      const d=asDate(item.dropoffDateTime||item.end); if(!d) return;
      const p=pct(d), title=`${esc(item.customerName||item.name||'—')} · ${hhmm(d)}`;
      const crit=isOverdue(item)?'crit':'';
      html+=`<div class="tl-dot ci ${crit}" style="left:${p}%" title="${title}"></div>`;
    });
    els.tlAxis.innerHTML=html;
  }

  /* ── Live countdown ── */
  function updateCountdown(){
    if(!els.countdown) return;
    const all=[
      ...getTab('checkout').map(i=>({t:asDate(i.pickupDateTime||i.start),type:'checkout'})),
      ...getTab('checkin').map(i=>({t:asDate(i.dropoffDateTime||i.end),type:'check-in'}))
    ];
    const now=Date.now();
    const next=all.filter(e=>e.t&&e.t.getTime()>now).sort((a,b)=>a.t-b.t)[0]||null;
    if(!next){els.countdown.textContent='';els.countdown.className='rb-countdown';return;}
    const diff=Math.round((next.t.getTime()-now)/60000);
    const label=diff<1?'Now!':(diff<60?`${diff}m`:`${Math.floor(diff/60)}h ${diff%60}m`);
    els.countdown.textContent=`⏱ Next ${next.type} in ${label}`;
    els.countdown.className='rb-countdown'+(diff<30?' urgent':'');
  }

  /* ── Overdue banner ── */
  function renderOverdueBanner(summary){
    const n=Number(summary&&summary.overdue||0);
    if(!els.overdueBanner) return;
    els.overdueBanner.classList.toggle('show',n>0);
    if(els.overdueText&&n>0) els.overdueText.textContent=`${n} overdue vehicle${n===1?'':'s'} — immediate attention needed`;
  }

  /* ── Render column ── */
  function renderCol(bodyEl,cntEl,items,type){
    if(!bodyEl) return;
    if(cntEl) cntEl.textContent=String(items.length);
    if(!items.length){bodyEl.innerHTML='<div class="rb-empty">&#916;εν υπάρχουν δεδομένα.</div>';return;}
    bodyEl.innerHTML=items.map(item=>renderCard(item,type)).join('');
  }

  function renderStations(stations){
    if(!Array.isArray(stations)||!stations.length) return;
    const cur=els.station.value;
    while(els.station.options.length>1) els.station.remove(1);
    stations.forEach(st=>{ const o=document.createElement('option'); o.value=o.textContent=st; els.station.appendChild(o); });
    if(cur&&cur!=='all') els.station.value=cur;
  }

  function render(){
    const out  = sortItems(applyFilters(getTab('checkout')),'out');
    const inn  = sortItems(applyFilters(getTab('checkin')),'in');
    const rawB = getTab('bookings');
    const hasDedicated=rawB.length>0;
    const bookSrc=hasDedicated?rawB:[...getTab('checkout'),...getTab('checkin')];
    const bookings=sortItems(applyFilters(bookSrc),'bookings');

    if(els.bookingsLabel) els.bookingsLabel.textContent=hasDedicated?'Bookings':"All Today's Ops";
    renderCol(els.listOut,      els.cntOut,      out,      'checkout');
    renderCol(els.listIn,       els.cntIn,       inn,      'checkin');
    renderCol(els.listBookings, els.cntBookings, bookings, hasDedicated?'bookings':'all');
    renderSummary(state.data.summary);
    renderOverdueBanner(state.data.summary);
    renderTimeline();
    renderStatsBar();
    updateCountdown();
    try{ postToWix({type:'resizeShell',height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)}); }catch(_){}
  }

  /* ── Auto-refresh ── */
  function startAuto(){ stopAuto(); state.autoTimer=setInterval(reloadData,5*60*1000); }
  function stopAuto(){ if(state.autoTimer){clearInterval(state.autoTimer);state.autoTimer=null;} }

  /* ── Controls ── */
  $('btnPrev').addEventListener('click',()=>{ els.datePick.value=addDays(els.datePick.value||ymd(new Date()),-1); reloadData(); });
  $('btnNext').addEventListener('click',()=>{ els.datePick.value=addDays(els.datePick.value||ymd(new Date()), 1); reloadData(); });
  $('btnToday').addEventListener('click',()=>{ els.datePick.value=ymd(new Date()); reloadData(); });
  $('btnRefresh').addEventListener('click',()=>reloadData());
  $('datePick').addEventListener('change',()=>reloadData());
  $('globalSearch').addEventListener('input',()=>{ state.search=els.search.value; render(); });
  $('stationFilter').addEventListener('change',()=>{ state.station=els.station.value; render(); });
  els.autoCheck.addEventListener('change',()=>{ if(els.autoCheck.checked){startAuto();els.autoLabel.classList.add('is-on');}else{stopAuto();els.autoLabel.classList.remove('is-on');} });

  /* Quick filters */
  document.querySelectorAll('.rb-fchip').forEach(btn=>
    btn.addEventListener('click',()=>window._rbSetFilter(btn.getAttribute('data-filter')))
  );

  /* Sort buttons */
  document.querySelectorAll('.rb-sort-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const col=btn.getAttribute('data-col');
      const key=btn.getAttribute('data-sort');
      if(state.sort[col].key===key){
        state.sort[col].dir=state.sort[col].dir==='asc'?'desc':'asc';
      } else {
        state.sort[col]={key, dir:'asc'};
      }
      /* update active state in this column's sort group */
      btn.closest('.rb-colhead-sort').querySelectorAll('.rb-sort-btn').forEach(b=>
        b.classList.toggle('active', b===btn)
      );
      render();
    });
  });

  /* Keyboard: ← → date navigation */
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    if(e.key==='ArrowLeft'){  els.datePick.value=addDays(els.datePick.value||ymd(new Date()),-1); reloadData(); }
    else if(e.key==='ArrowRight'){ els.datePick.value=addDays(els.datePick.value||ymd(new Date()), 1); reloadData(); }
  });

  /* Countdown tick every 30s */
  state.cdTimer=setInterval(updateCountdown,30000);

  /* ── Sidebar nav ── */
  document.querySelectorAll('[data-route]').forEach(btn=>
    btn.addEventListener('click',()=>postToWix({type:'navigate',route:btn.getAttribute('data-route')}))
  );

  /* ── User menu ── */
  const menuBtn=$('userMenuBtn'), menu=$('userMenu');
  if(menuBtn&&menu){
    menuBtn.parentElement.style.display='';
    menuBtn.addEventListener('click',e=>{ e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click',e=>{ if(!menu.contains(e.target)&&!menuBtn.contains(e.target)) menu.classList.remove('open'); });
    menu.querySelectorAll('[data-menu-action]').forEach(n=>
      n.addEventListener('click',()=>{ postToWix({type:'menuAction',action:n.getAttribute('data-menu-action')}); menu.classList.remove('open'); })
    );
  }

  /* ── Trusted-origin check ── */
  const TRUSTED=['wix.com','wixsite.com','parastorage.com','wixstatic.com'];
  function isTrusted(origin){
    const raw=s(origin).toLowerCase(); if(!raw) return true;
    try{
      const host=new URL(raw).hostname.toLowerCase(); if(!host) return false;
      if(TRUSTED.some(t=>host===t||host.endsWith('.'+t))) return true;
      try{ const rh=new URL(document.referrer).hostname.toLowerCase(); if(rh&&rh===host) return true; }catch(_){}
      return false;
    }catch(_){ return false; }
  }

  /* ── postMessage handler ── */
  window.addEventListener('message',event=>{
    if(event.origin&&!isTrusted(event.origin)) return;
    const d=event.data||{}; if(!d||!d.type) return;

    if(d.type==='resume'){
      const today=ymd(new Date());
      if(!els.datePick.value||els.datePick.value!==today){ els.datePick.value=today; reloadData(); }
      return;
    }

    if(d.type==='loadDailyOps'){
      const tabs=d.tabs||{};
      if(!Array.isArray(tabs.checkout)||!tabs.checkout.length){ const a=d.checkOut||d.checkout||d.CheckOut; if(Array.isArray(a)&&a.length) tabs.checkout=a; }
      if(!Array.isArray(tabs.checkin)||!tabs.checkin.length){  const a=d.checkIn||d.checkin||d.CheckIn;   if(Array.isArray(a)&&a.length) tabs.checkin=a;  }
      if(!Array.isArray(tabs.bookings)||!tabs.bookings.length){ const a=d.bookings||d.Bookings;            if(Array.isArray(a)&&a.length) tabs.bookings=a; }

      state.data={ tabs, summary:d.summary||{}, stations:Array.isArray(d.stations)?d.stations:[] };
      renderStations(state.data.stations);
      stampRefresh();

      const nO=(tabs.checkout||[]).length, nI=(tabs.checkin||[]).length, nB=(tabs.bookings||[]).length;
      setStatus(`OK • out=${nO} in=${nI} bookings=${nB} overdue=${state.data.summary.overdue||0}`);
      render();
      return;
    }

    if(d.type==='userContext'||d.type==='backroomUserContext'){
      const u=d.user||d.identity||d||{}, role=d.role||d.currentRole||d||{};
      state.user.name=s(u.displayName||u.fullName||u.name||u.email||d.fullName||d.name||d.email||'Operator');
      state.user.role=s(role.label||role.roleLabel||role.name||d.roleLabel||d.role||'Backroom');
      document.querySelectorAll('#menuUserName,#menuUserName2').forEach(el=>el.textContent=state.user.name);
      document.querySelectorAll('#menuUserRole,#menuUserRole2').forEach(el=>el.textContent=state.user.role);
      const badge=$('userBadge'); if(badge) badge.textContent=state.user.name.slice(0,2).toUpperCase();
      const today=$('todayMeta');
      if(today){try{today.textContent=new Date().toLocaleDateString('el-GR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});}catch(_){}}
      if(menuBtn) menuBtn.parentElement.style.display='';
      const can=d.canNavigate||{};
      document.querySelectorAll('[data-route]').forEach(btn=>{
        const r=btn.getAttribute('data-route');
        if(Object.prototype.hasOwnProperty.call(can,r)&&!can[r]) btn.style.display='none';
      });
      return;
    }
  });

  /* ── Auto-init ── */
  postToWix({type:'requestUserContext'});
  els.datePick.value=ymd(new Date());
  reloadData();

})();
</script>
</body>
</html>
