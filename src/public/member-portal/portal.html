<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ο Λογαριασμός μου</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f2f0eb;color:#1f1a13;min-height:100vh;font-size:14px}
.hidden{display:none!important}

/* ── Loading ── */
#loadingScreen{position:fixed;inset:0;background:#f2f0eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:99}
.loader-ring{width:44px;height:44px;border:3px solid #e0ddd5;border-top-color:#3f748a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{font-size:14px;color:#aaa;font-weight:600}

/* ── Error state ── */
#errorScreen{position:fixed;inset:0;background:#f2f0eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center}
#errorScreen h2{font-size:18px;color:#1f1a13}
#errorScreen p{font-size:13px;color:#999;max-width:260px}
.retry-btn{margin-top:8px;background:#3f748a;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.retry-btn:hover{background:#2d6072}

/* ── Header ── */
#hdr{background:linear-gradient(135deg,#1a1510 0%,#2a3d47 100%);color:#fff;padding:22px 20px 0;position:relative}
#hdrTop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
#avatar{width:50px;height:50px;border-radius:50%;background:#e7bf69;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#1f1a13;flex-shrink:0;letter-spacing:-.5px;border:2px solid rgba(255,255,255,.15)}
#hdrText{flex:1;min-width:0}
#greeting{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:2px}
#memberName{font-size:18px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#memberEmail{font-size:12px;color:rgba(255,255,255,.45);display:block;margin-top:1px}

/* Stats row */
#statsRow{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.08);margin:0 -20px}
.stat{flex:1;padding:12px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border:none}
.stat-val{font-size:20px;font-weight:900;color:#e7bf69;display:block}
.stat-lbl{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;display:block}

/* ── Tab bar ── */
#tabBar{display:flex;background:#fff;border-bottom:2px solid #e8e4da;padding:0 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;padding:14px 18px;font-size:14px;font-weight:700;color:#aaa;cursor:pointer;transition:color .18s,border-color .18s;font-family:inherit;white-space:nowrap}
.tab.active{color:#3f748a;border-bottom-color:#3f748a}
.tab:hover:not(.active){color:#555}

/* ── Content ── */
#content{padding:20px 16px 48px;max-width:720px;margin:0 auto}

/* Filter chips */
#filterBar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #ddd8cc;color:#777;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;transition:all .18s;font-family:inherit}
.chip.active{background:#3f748a;border-color:#3f748a;color:#fff}
.chip:hover:not(.active){border-color:#3f748a;color:#3f748a}

/* CTA */
#newBookingCta{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#3f748a,#2d5f73);color:#fff;border-radius:14px;padding:16px 20px;margin-bottom:20px;cursor:pointer;border:none;width:100%;font-family:inherit;text-align:left}
#newBookingCta:hover{opacity:.9}
#newBookingCta strong{font-size:15px;display:block}
#newBookingCta span{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;display:block}
#newBookingCta svg{width:28px;height:28px;opacity:.8;flex-shrink:0}

/* Booking card */
.bk-card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.bk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.bk-num{font-size:14px;font-weight:900;color:#1f1a13;letter-spacing:.02em}
.bk-status{font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.s-confirmed,.s-active{background:#e3f5e8;color:#1a7a45}
.s-pending{background:#fef9e7;color:#a07000}
.s-canceled{background:#fef2f0;color:#b83c2e}
.s-completed{background:#eef2ff;color:#3a5fd4}
.s-default{background:#f0ece3;color:#777}
.bk-vehicle{font-size:15px;font-weight:800;color:#1f1a13;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bk-vehicle svg{width:18px;height:18px;color:#3f748a;flex-shrink:0}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.bk-field strong{display:block;font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.bk-field span{font-size:13px;color:#333;font-weight:500}
.bk-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #f0ece3}
.bk-footer-meta{font-size:12px;color:#bbb}
.bk-price{font-size:20px;font-weight:900;color:#1f1a13}
.bk-price sub{font-size:12px;font-weight:600;color:#888;vertical-align:middle;margin-left:2px}

/* Empty / spin */
.spin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px;color:#ccc}
.spin-ring{width:32px;height:32px;border:2.5px solid #e0ddd5;border-top-color:#3f748a;border-radius:50%;animation:spin .8s linear infinite}
.empty{text-align:center;padding:56px 24px 40px}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty h3{font-size:15px;font-weight:700;color:#aaa;margin-bottom:6px}
.empty p{font-size:13px;color:#ccc}

/* Profile */
.profile-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.profile-banner{background:linear-gradient(135deg,#1a1510 0%,#2a3d47 100%);padding:28px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.profile-av-lg{width:68px;height:68px;border-radius:50%;background:#e7bf69;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#1f1a13;letter-spacing:-.5px}
.profile-name{font-size:19px;font-weight:900;color:#fff}
.profile-tag{font-size:12px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.1);padding:3px 10px;border-radius:999px}
.profile-fields{padding:4px 0}
.pf-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #f2f0eb}
.pf-row:last-child{border:none}
.pf-label{font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.pf-val{font-size:14px;font-weight:600;color:#1f1a13;text-align:right}
.pf-val.empty-val{color:#ccc;font-weight:400;font-style:italic}
.settings-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 20px 20px;padding:14px;background:#f2f0eb;border:none;border-radius:10px;font-size:14px;font-weight:700;color:#3f748a;cursor:pointer;font-family:inherit;transition:background .18s;width:calc(100% - 40px)}
.settings-btn:hover{background:#e8e4da}

@media(max-width:480px){.bk-grid{grid-template-columns:1fr}.tab{padding:14px 14px;font-size:13px}#statsRow{flex-wrap:wrap}.stat{min-width:50%}}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loader-ring"></div>
  <span id="loadingText">Φόρτωση λογαριασμού...</span>
</div>

<div id="errorScreen" class="hidden">
  <div style="font-size:48px;opacity:.3">⚠️</div>
  <h2>Δεν ήταν δυνατή η σύνδεση</h2>
  <p>Ο λογαριασμός δεν φορτώθηκε. Βεβαιωθείτε ότι είστε συνδεδεμένοι και δοκιμάστε ξανά.</p>
  <button class="retry-btn" id="retryBtn">Επανάληψη</button>
</div>

<div id="app" class="hidden">
  <div id="hdr">
    <div id="hdrTop">
      <div id="avatar">?</div>
      <div id="hdrText">
        <span id="greeting">Καλώς ήρθατε,</span>
        <strong id="memberName">—</strong>
        <span id="memberEmail"></span>
      </div>
    </div>
    <div id="statsRow">
      <div class="stat"><span class="stat-val" id="statTotal">—</span><span class="stat-lbl">Κρατήσεις</span></div>
      <div class="stat"><span class="stat-val" id="statUpcoming">—</span><span class="stat-lbl">Επερχόμενες</span></div>
      <div class="stat"><span class="stat-val" id="statCompleted">—</span><span class="stat-lbl">Ολοκληρωμένες</span></div>
    </div>
  </div>

  <div id="tabBar">
    <button class="tab active" data-tab="bookings">📋 Κρατήσεις μου</button>
    <button class="tab" data-tab="profile">👤 Προφίλ</button>
  </div>

  <div id="content">

    <!-- Bookings panel -->
    <div id="panelBookings">
      <button id="newBookingCta">
        <div>
          <strong>Νέα Κράτηση</strong>
          <span>Κλείστε το επόμενο αυτοκίνητό σας</span>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <div id="filterBar">
        <button class="chip active" data-filter="all">Όλες</button>
        <button class="chip" data-filter="upcoming">Επερχόμενες</button>
        <button class="chip" data-filter="past">Παρελθοντικές</button>
      </div>
      <div id="bookingsList"><div class="spin"><div class="spin-ring"></div><span>Φόρτωση κρατήσεων...</span></div></div>
    </div>

    <!-- Profile panel -->
    <div id="panelProfile" class="hidden">
      <div id="profileContent"><div class="spin"><div class="spin-ring"></div><span>Φόρτωση προφίλ...</span></div></div>
    </div>

  </div>
</div>

<script>
(function(){
  var currentFilter = 'all';
  var profileLoaded = false;
  var allBookings = [];
  var initTimer = null;

  function post(msg){ try{ window.parent.postMessage(msg,'*'); }catch(_){} }

  function fmt(dt){
    if(!dt) return '—';
    try{
      var d = new Date(dt);
      return d.toLocaleDateString('el-GR',{day:'2-digit',month:'short',year:'numeric'}) + ' ' +
             d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
    }catch(_){ return dt; }
  }
  function fmtDate(dt){
    if(!dt) return '—';
    try{ return new Date(dt).toLocaleDateString('el-GR',{day:'2-digit',month:'long',year:'numeric'}); }catch(_){ return dt; }
  }

  var SLABELS = {Confirmed:'Επιβεβαιωμένη',Active:'Ενεργή',Pending:'Σε αναμονή',Canceled:'Ακυρωμένη',Completed:'Ολοκληρωμένη'};
  var SCLASS = {confirmed:'s-confirmed',active:'s-active',pending:'s-pending',canceled:'s-canceled',cancelled:'s-canceled',completed:'s-completed'};
  function sLabel(s){ return SLABELS[s]||s||'—'; }
  function sClass(s){ return SCLASS[(s||'').toLowerCase()]||'s-default'; }

  function initials(n){
    if(!n) return '?';
    var p=n.trim().split(/\s+/).filter(Boolean);
    if(p.length>=2) return (p[0][0]+p[p.length-1][0]).toUpperCase();
    return (p[0]||'?')[0].toUpperCase();
  }

  function showApp(m, initialTab){
    clearTimeout(initTimer);
    var name = (m.name||'').trim() || m.email || 'Μέλος';
    var ini = initials(name);
    document.getElementById('avatar').textContent = ini;
    document.getElementById('memberName').textContent = name;
    document.getElementById('memberEmail').textContent = m.email || '';
    var hour = new Date().getHours();
    document.getElementById('greeting').textContent =
      hour < 12 ? 'Καλημέρα,' : hour < 18 ? 'Καλησπέρα,' : 'Καλό βράδυ,';
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('errorScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    var tab = initialTab || 'bookings';
    if (tab === 'profile') {
      showTab('profile');
      // Load bookings in background for stats
      post({type:'REQUEST_MY_BOOKINGS', filter: null});
    } else {
      loadBookings('all');
    }
  }

  function showTab(tab){
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
    document.getElementById('panelBookings').classList.toggle('hidden', tab!=='bookings');
    document.getElementById('panelProfile').classList.toggle('hidden', tab!=='profile');
    if(tab==='bookings') {
      if(!document.getElementById('bookingsList').querySelector('.bk-card, .empty')) loadBookings(currentFilter);
    } else if(tab==='profile' && !profileLoaded) {
      loadProfile();
    }
  }

  function loadBookings(filter){
    currentFilter = filter;
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c.dataset.filter===filter); });
    document.getElementById('bookingsList').innerHTML = '<div class="spin"><div class="spin-ring"></div><span>Φόρτωση...</span></div>';
    post({type:'REQUEST_MY_BOOKINGS', filter: filter==='all'?null:filter});
  }
  function loadProfile(){
    document.getElementById('profileContent').innerHTML = '<div class="spin"><div class="spin-ring"></div><span>Φόρτωση...</span></div>';
    post({type:'REQUEST_MY_PROFILE'});
  }

  function updateStats(bookings){
    var now = new Date();
    var total = bookings.length;
    var upcoming = bookings.filter(function(b){ return b.status!=='Canceled' && new Date(b.pickupDateTime) > now; }).length;
    var completed = bookings.filter(function(b){ return b.status==='Completed' || (b.dropoffDateTime && new Date(b.dropoffDateTime) < now && b.status!=='Canceled'); }).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statUpcoming').textContent = upcoming;
    document.getElementById('statCompleted').textContent = completed;
  }

  function renderBookings(list){
    var el = document.getElementById('bookingsList');
    if(!list||!list.length){
      el.innerHTML = '<div class="empty"><div class="empty-icon">🚗</div><h3>Δεν βρέθηκαν κρατήσεις</h3><p>Δεν υπάρχουν κρατήσεις για αυτή την κατηγορία.</p></div>';
      return;
    }
    el.innerHTML = list.map(function(b){
      var pickupD = fmtDate(b.pickupDateTime);
      var dropoffD = fmtDate(b.dropoffDateTime);
      return '<div class="bk-card">'+
        '<div class="bk-head">'+
          '<span class="bk-num">&#35;'+(b.bookingNumber||b._id||'—')+'</span>'+
          '<span class="bk-status '+sClass(b.status)+'">'+sLabel(b.status)+'</span>'+
        '</div>'+
        '<div class="bk-vehicle">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h13l4 4v4a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>'+
          (b.vehicleName||'Όχημα')+
        '</div>'+
        '<div class="bk-grid">'+
          '<div class="bk-field"><strong>&#128197; Παραλαβή</strong><span>'+pickupD+'</span></div>'+
          '<div class="bk-field"><strong>&#128197; Επιστροφή</strong><span>'+dropoffD+'</span></div>'+
          '<div class="bk-field"><strong>&#128205; Σημείο παραλαβής</strong><span>'+(b.pickupLocation||'—')+'</span></div>'+
          '<div class="bk-field"><strong>&#128205; Σημείο επιστροφής</strong><span>'+(b.dropoffLocation||'—')+'</span></div>'+
        '</div>'+
        (b.totalPrice?
          '<div class="bk-footer">'+
            '<span class="bk-footer-meta">'+
              (b.insurance?'Ασφάλεια: '+b.insurance:'&nbsp;')+
            '</span>'+
            '<span class="bk-price">'+Number(b.totalPrice).toFixed(2)+'<sub>€</sub></span>'+
          '</div>':'')+
      '</div>';
    }).join('');
  }

  function renderProfile(p){
    profileLoaded = true;
    var el = document.getElementById('profileContent');
    var name = (p.name||'').trim()||'—';
    function field(lbl,val){
      return '<div class="pf-row"><span class="pf-label">'+lbl+'</span>'+
             '<span class="pf-val'+(val?'':' empty-val')+'">'+(val||'—')+'</span></div>';
    }
    el.innerHTML =
      '<div class="profile-card">'+
        '<div class="profile-banner">'+
          '<div class="profile-av-lg">'+initials(name)+'</div>'+
          '<span class="profile-name">'+name+'</span>'+
          '<span class="profile-tag">Μέλος Diamond Rent a Car</span>'+
        '</div>'+
        '<div class="profile-fields">'+
          field('✉️ Email', p.email)+
          field('📱 Τηλέφωνο', p.phone)+
          field('👤 Όνομα', p.firstName||p.name)+
          field('👤 Επώνυμο', p.lastName)+
        '</div>'+
        '<button class="settings-btn" id="settingsBtn">⚙️ Ρυθμίσεις Λογαριασμού</button>'+
      '</div>';
    document.getElementById('settingsBtn').addEventListener('click',function(){
      post({type:'MEMBER_PORTAL_NAV', path:'/my-account'});
    });
  }

  // Tab clicks
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){ showTab(this.dataset.tab); });
  });
  // Filter chips
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){ loadBookings(this.dataset.filter); });
  });
  // New booking CTA
  document.getElementById('newBookingCta').addEventListener('click',function(){
    post({type:'MEMBER_PORTAL_NAV', path:'/'});
  });
  // Retry button
  document.getElementById('retryBtn').addEventListener('click',function(){
    document.getElementById('errorScreen').classList.add('hidden');
    document.getElementById('loadingScreen').classList.remove('hidden');
    document.getElementById('loadingText').textContent = 'Επανασύνδεση...';
    post({type:'PORTAL_READY'});
    initTimer = setTimeout(function(){
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('errorScreen').classList.remove('hidden');
    }, 6000);
  });

  // Messages from Wix parent
  window.addEventListener('message',function(event){
    var raw=event.data,d=null;
    if(typeof raw==='string'){try{d=JSON.parse(raw);}catch(_){return;}}else{d=raw;}
    if(!d||!d.type) return;
    if(d.type==='MEMBER_INIT'){
      if(d.member) showApp(d.member, d.tab);
      return;
    }
    if(d.type==='MY_BOOKINGS'){
      if(d.ok){
        if(currentFilter==='all') updateStats(d.bookings||[]);
        renderBookings(d.bookings||[]);
      } else {
        document.getElementById('bookingsList').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Αδυναμία φόρτωσης</h3><p>Προσπαθήστε ξανά σε λίγο.</p></div>';
      }
      return;
    }
    if(d.type==='MY_PROFILE'){
      if(d.ok) renderProfile(d.profile||{});
      else document.getElementById('profileContent').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Αδυναμία φόρτωσης</h3><p>Προσπαθήστε ξανά σε λίγο.</p></div>';
      return;
    }
  });

  // Signal parent we're ready — timeout to show error if no MEMBER_INIT arrives
  setTimeout(function(){ post({type:'PORTAL_READY'}); }, 100);
  initTimer = setTimeout(function(){
    if(document.getElementById('app').classList.contains('hidden')){
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('errorScreen').classList.remove('hidden');
    }
  }, 8000);
})();
</script>
</body>
</html>
